name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python-version: "3.9"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Smoke test the CLI end to end
        shell: bash
        run: |
          python -m ffxforensics.cli sample ci_demo/source --tz +01:00
          python -m ffxforensics.cli acquire ci_demo/source/69mytvds.default-esr ci_demo/wd --no-lock
          python -m ffxforensics.cli verify ci_demo/wd/Firefox-Linux-Evidence-all.sha256 ci_demo/wd
          python -m ffxforensics.cli analyze ci_demo/wd/Firefox-Linux-Evidence \
            -o ci_demo/results --tz +01:00 \
            --manifest ci_demo/wd/Firefox-Linux-Evidence-all.sha256
          test -s ci_demo/results/findings.json
          test -s ci_demo/results/examination_report.html

      - name: Upload generated reports
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: case029-reports
          path: ci_demo/results/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest --cov=ffxforensics --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests
